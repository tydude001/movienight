[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Beyond ruff's default E4/E7/E9/F: import order, pyupgrade, bugbear, comprehensions.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is formatter's job, not the linter's
    "B008",  # function call in default arg — common and deliberate here
]

[tool.ruff.lint.per-file-ignores]
# E702: seed lines like `add_film(1); set_plex(1)` are the suite's deliberate idiom
"**/tests/**" = ["B011", "E702"]
