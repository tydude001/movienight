name: Bug
description: Movie Night ran, and did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't attach your Letterboxd export, your database or your `.env`.**
        Issues are public, and edit history stays visible even if you delete
        a comment later. Name the film or two involved instead, with their year.
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The page, and the button, filter or import you used.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: The wrong ranking, match or count, and what it should have been.
    validations:
      required: true
  - type: dropdown
    id: keys
    attributes:
      label: What's set
      multiple: true
      options:
        - Plex
        - TMDb key
        - OMDb key
        - RSS sync (LETTERBOXD_A / _B)
        - Watchlist scrape on
        - Letterboxd scores on
        - None of these
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Optional: the commit you run (`git rev-parse --short HEAD`), how you
        run it (Docker or a dev server), and a log line or stack trace with
        keys, tokens and URLs stripped out.
